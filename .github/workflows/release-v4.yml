name: Stage effect-zero v4

on:
  push:
    tags:
      - "effect-zero-v4@*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Prepare verification database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5438/effect_zero
          PG_URL: postgresql://postgres:postgres@127.0.0.1:5438/effect_zero
          PGPASSWORD: postgres
        run: |
          psql postgresql://postgres@127.0.0.1:5438/postgres --set ON_ERROR_STOP=on --command 'CREATE DATABASE effect_zero'
          pnpm --filter @effect-zero/example-data db:migrate
          pnpm seed:ztunes

      - name: Verify release tag and package version
        shell: bash
        run: |
          test "${GITHUB_REF_PROTECTED}" = "true"
          version="$(node -p "require('./packages/effect-zero-v4/package.json').version")"
          [[ "${version}" =~ ^0\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "effect-zero-v4@${version}"

      - name: Run release checks
        run: |
          pnpm release:check
          pnpm verify:api:package
          pnpm verify:mutation-stress:package

      - name: Pack candidate once
        id: pack
        shell: bash
        run: |
          version="$(node -p "require('./packages/effect-zero-v4/package.json').version")"
          node tools/pack-package.mjs packages/effect-zero-v4 --out-dir "${RUNNER_TEMP}/effect-zero-v4"
          tarball="${RUNNER_TEMP}/effect-zero-v4/awstin-effect-zero-v4-${version}.tgz"
          test -f "${tarball}"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact candidate installation
        run: >-
          node tools/check-package-installs.mjs
          --package-spec
          "@awstin/effect-zero-v4=${{ steps.pack.outputs.tarball }}"

      - name: Verify candidate contents
        run: >-
          node tools/verify-package-tarball.mjs
          "${{ steps.pack.outputs.tarball }}"
          "${RUNNER_TEMP}/effect-zero-v4/manifest.json"

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: effect-zero-v4-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/effect-zero-v4/manifest.json

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-stage
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0

      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: effect-zero-v4-${{ github.sha }}
          path: candidate

      - name: Stage exact candidate with npm trusted publishing
        shell: bash
        run: |
          set -- candidate/*.tgz
          test "$#" -eq 1
          test -f "$1"
          npm stage publish "$1" --access public --tag beta
